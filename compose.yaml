services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: openseo
      POSTGRES_PASSWORD: openseo
      POSTGRES_DB: openseo
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openseo -d openseo"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - open_seo_pg:/var/lib/postgresql/data

  open-seo:
    image: ${OPEN_SEO_IMAGE:-open-seo:local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there (e.g. OPENROUTER_API_KEY) silently never reached
    # the app. Compose errors if .env is missing; the quickstart's
    # `cp .env.example .env` creates it.
    env_file:
      - .env
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - DATABASE_PROVIDER=postgres
      - POSTGRES_DATABASE_URL=postgres://openseo:openseo@postgres:5432/openseo
      - CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://openseo:openseo@postgres:5432/openseo
      - OPENSEO_TELEMETRY_DISABLED=1
      - DO_NOT_TRACK=1
      # Real Elite v1 forces paid keys empty so a dummy value in .env cannot
      # reach the process. The server gate is the enforcement; this override
      # stops Compose from forwarding the keys. Restore the ${VAR:-} form only
      # when Jose approves DataForSEO or OpenRouter spend.
      - DATAFORSEO_API_KEY=
      - OPENROUTER_API_KEY=
      - OPENROUTER_MODEL=
      - REAL_ELITE_COMMAND_API=http://host.docker.internal:3100
      - REAL_ELITE_COMMAND_TOKEN=${REAL_ELITE_COMMAND_TOKEN:-}
      - REAL_ELITE_OPENSEO_PROJECT_ID=${REAL_ELITE_OPENSEO_PROJECT_ID:-}
      - REAL_ELITE_BASELINE_DIR=/seo-data
      - REAL_ELITE_SITE_URL=https://www.realelitecontracting.com
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
      - "/Volumes/Silver T7/AI-SHARED/seo:/seo-data:ro"
volumes:
  open_seo_data:
  open_seo_pg:
